name: Docker CI

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-portfolio .

      - name: Run container
        run: docker run -d -p 8080:80 --name site my-portfolio

      - name: Test site responds
        run: |
          sleep 3
          curl -f http://localhost:8080
